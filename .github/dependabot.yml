version: 2
updates:
  - package-ecosystem: gomod
    directory: /go
    schedule: {interval: weekly}
    groups:
      go-minor: {update-types: [minor, patch], exclude-patterns: ["github.com/parquet-go/*"]}
  - package-ecosystem: pip
    directory: /conformance/generators
    schedule: {interval: monthly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
