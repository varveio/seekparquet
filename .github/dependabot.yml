version: 2
updates:
  - package-ecosystem: gomod
    directory: /go
    schedule: {interval: weekly}
    groups:
      go-minor: {update-types: [minor, patch], exclude-patterns: ["github.com/parquet-go/*"]}
  - package-ecosystem: pip
    directory: /conformance/generators
    schedule: {interval: monthly}
  # "/" scans .github/workflows only; the composite action under .github/actions pins its own
  # actions (setup-go, cache), which are bumped only if its directory is named.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule: {interval: monthly}
  - package-ecosystem: gradle
    directory: /java
    schedule: {interval: weekly}
    groups:
      java-minor: {update-types: [minor, patch], exclude-patterns: ["org.apache.parquet:*"]}
    ignore:
      # slf4j-nop must match the slf4j-api 1.7 line that parquet-java is built against.
      - dependency-name: "org.slf4j:*"
        update-types: [version-update:semver-major, version-update:semver-minor]
