name: Specification change
description: Propose a change to which files are valid, what queries return, or the refusal codes.
labels: [spec]
body:
  - type: markdown
    attributes:
      value: Substantive changes need a written proposal (spec/proposals/). Use this issue to discuss the idea first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What fails or is missing today, with an example.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: compat
    attributes:
      label: Compatibility
      description: Which existing files or query results would change.
