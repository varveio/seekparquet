name: Set up Go with a shared module cache and a per-job build cache
description: >
  Go at the version go/go.mod names, with two caches. The module cache (GOMODCACHE) is one entry
  per runner OS and architecture and dependency set, shared by every job. The build cache
  (GOCACHE) is per job (the `key` input) and per commit, restored from the job's newest. A push
  to main saves both when the job ends; any other event restores only. setup-go's own cache is
  off.

inputs:
  key:
    description: The job's build-cache name (its job id, and its matrix value where it has one)
    required: true

runs:
  using: composite
  steps:
    - name: Set up Go (version from go/go.mod)
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
      with:
        go-version-file: go/go.mod
        cache: false

    - name: Locate the Go caches
      id: paths
      shell: bash
      run: |
        cd "$GITHUB_WORKSPACE/go"
        echo "toolchain=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
        echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        echo "deps=${{ hashFiles('go/go.mod', 'go/go.sum') }}" >> "$GITHUB_OUTPUT"

    # The module cache's key names no job and no commit, and a key once saved is never
    # overwritten. Several main-push jobs may save it at once: the first upload wins and the
    # others log a warning, which does not fail them. On a push to main the post step saves it
    # when the job ends, unless the key was an exact hit.
    - name: Restore the Go module cache (saved at the end of the job)
      id: modcache-main
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
      with:
        path: ${{ steps.paths.outputs.gomodcache }}
        key: seekparquet-go-v1-mod-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.deps }}
        restore-keys: |
          seekparquet-go-v1-mod-${{ runner.os }}-${{ runner.arch }}-

    - name: Restore the Go module cache
      if: github.event_name != 'push' || github.ref != 'refs/heads/main'
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
      with:
        path: ${{ steps.paths.outputs.gomodcache }}
        key: seekparquet-go-v1-mod-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.deps }}
        restore-keys: |
          seekparquet-go-v1-mod-${{ runner.os }}-${{ runner.arch }}-

    # Populate the entire dependency graph before any job saves a shared immutable key.
    # download all can add sums: use a scratch manifest so tidy still checks the lockfile.
    - name: Download the complete module graph before saving a new module cache
      if: steps.modcache-main.outcome == 'success' && steps.modcache-main.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        copy=$(mktemp -d)
        trap 'rm -rf "$copy"' EXIT
        cp "$GITHUB_WORKSPACE/go/go.mod" "$GITHUB_WORKSPACE/go/go.sum" "$copy/"
        (cd "$copy" && GOWORK=off go mod download all)

    - name: Restore the Go build cache (saved at the end of the job)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      id: buildcache-main
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
      with:
        path: ${{ steps.paths.outputs.gocache }}
        key: seekparquet-go-v1-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.toolchain }}-${{ inputs.key }}-${{ steps.paths.outputs.deps }}-${{ github.sha }}
        restore-keys: |
          seekparquet-go-v1-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.toolchain }}-${{ inputs.key }}-${{ steps.paths.outputs.deps }}-
          seekparquet-go-v1-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.toolchain }}-${{ inputs.key }}-

    - name: Restore the Go build cache
      if: github.event_name != 'push' || github.ref != 'refs/heads/main'
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
      with:
        path: ${{ steps.paths.outputs.gocache }}
        key: seekparquet-go-v1-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.toolchain }}-${{ inputs.key }}-${{ steps.paths.outputs.deps }}-${{ github.sha }}
        restore-keys: |
          seekparquet-go-v1-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.toolchain }}-${{ inputs.key }}-${{ steps.paths.outputs.deps }}-
          seekparquet-go-v1-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.toolchain }}-${{ inputs.key }}-
