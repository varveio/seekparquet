name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.diff.outputs.go }}
      contract: ${{ steps.diff.outputs.contract }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "go=true" >> "$GITHUB_OUTPUT"; echo "contract=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files="$(git diff --name-only "$base" HEAD)"
          echo "$files"
          if echo "$files" | grep -qE '^(go/|\.github/)'; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi
          if echo "$files" | grep -qE '^(spec/|conformance/|\.github/)'; then echo "contract=true" >> "$GITHUB_OUTPUT"; else echo "contract=false" >> "$GITHUB_OUTPUT"; fi

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.contract == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: test
        run: go test -race ./...
        if: runner.os != 'Windows'
      - name: test (no race detector)
        run: go test ./...
        if: runner.os == 'Windows'
      - name: fuzz seeds
        run: go test -run 'Fuzz' ./...
      - name: go mod tidy
        if: runner.os == 'Linux'
        run: go mod tidy -diff

  conformance:
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: schemas and fixture checksums
        run: |
          python -m pip install -r conformance/generators/requirements.txt
          python conformance/harness/check_suite.py
      - name: harness and Thrift codec self-tests
        working-directory: conformance
        run: python -m unittest harness/test_run.py generators/test_parquet_meta.py generators/test_oracle.py generators/test_case_generation.py
      - name: fixtures regenerate byte for byte
        run: python conformance/generators/check_reproducible.py
      - name: reference adapter (full-scan oracle)
        run: python conformance/harness/run.py --adapter "python conformance/harness/reference_adapter.py"
      - name: Go adapter
        run: |
          (cd go && go build -o "$RUNNER_TEMP/seekparquet-conformance" ./internal/cmd/conformance)
          python conformance/harness/run.py --adapter "$RUNNER_TEMP/seekparquet-conformance"

  ci-ok:
    if: always()
    needs: [changes, go, conformance]
    runs-on: ubuntu-latest
    steps:
      - name: every job that was needed succeeded
        env:
          CHANGES: ${{ needs.changes.result }}
          GO_NEEDED: ${{ needs.changes.outputs.go }}
          CONTRACT_NEEDED: ${{ needs.changes.outputs.contract }}
          GO_RESULT: ${{ needs.go.result }}
          CONFORMANCE_RESULT: ${{ needs.conformance.result }}
        run: |
          [ "$CHANGES" = "success" ] || { echo "change detection ended with: $CHANGES"; exit 1; }
          case "$GO_NEEDED/$CONTRACT_NEEDED" in
            true/true|true/false|false/true|false/false) ;;
            *) echo "change detection gave unexpected outputs: go=$GO_NEEDED contract=$CONTRACT_NEEDED"; exit 1;;
          esac
          if [ "$GO_NEEDED" = "true" ] || [ "$CONTRACT_NEEDED" = "true" ]; then
            [ "$GO_RESULT" = "success" ] || { echo "go was needed and ended with: $GO_RESULT"; exit 1; }
            [ "$CONFORMANCE_RESULT" = "success" ] || { echo "conformance was needed and ended with: $CONFORMANCE_RESULT"; exit 1; }
          else
            [ "$GO_RESULT" = "skipped" ] || { echo "go was not needed but ended with: $GO_RESULT"; exit 1; }
            [ "$CONFORMANCE_RESULT" = "skipped" ] || { echo "conformance was not needed but ended with: $CONFORMANCE_RESULT"; exit 1; }
          fi
