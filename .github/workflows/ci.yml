name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.diff.outputs.go }}
      java: ${{ steps.diff.outputs.java }}
      conformance: ${{ steps.diff.outputs.conformance }}
      macos: ${{ steps.diff.outputs.macos }}
      shards: ${{ steps.shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: python3 scripts/ci/policy.py
      - id: shards
        run: echo "matrix=$(python3 scripts/ci/go-shards.py --matrix)" >> "$GITHUB_OUTPUT"
      - name: CI policy and shard regressions
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v

  go-lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-go
        with:
          key: go-lint
      - name: format, vet and module hygiene
        working-directory: go
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go mod tidy -diff
      - name: verify live race-shard coverage
        run: python3 scripts/ci/go-shards.py --check

  go-race:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-go
        with:
          key: go-race-${{ matrix.shard }}
      - name: race tests (includes fuzz seeds)
        run: python3 scripts/ci/go-shards.py --run '${{ matrix.shard }}'
      - name: retain race diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: go-race-${{ matrix.shard }}
          path: go-race-${{ matrix.shard }}.json
          retention-days: 14

  go-windows:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-go
        with:
          key: go-windows
      - name: vet Windows packages
        working-directory: go
        run: go vet ./...
      - name: test Windows packages
        working-directory: go
        run: go test -count=1 -timeout=12m ./...

  # Full macOS race coverage on main/nightly/manual and elevated PRs.
  go-macos:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-go
        with:
          key: go-macos
      - working-directory: go
        run: |
          go vet ./...
          go test -race -count=1 -timeout=15m ./...

  conformance:
    needs: changes
    if: needs.changes.outputs.conformance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-go
        with:
          key: conformance
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: conformance/generators/requirements.txt
      - name: schemas and fixture checksums
        run: |
          python -m pip install -r conformance/generators/requirements.txt
          python conformance/harness/check_suite.py
      - name: harness and Thrift codec self-tests
        working-directory: conformance
        run: python -m unittest harness/test_run.py harness/test_manifest_schema.py harness/test_check_indexed_access.py generators/test_parquet_meta.py generators/test_oracle.py generators/test_case_generation.py generators/test_independent.py
      - name: Python validator oracle (tests, validator cases, valid and invalid corpus)
        run: |
          python -m unittest discover -s conformance/validator -v
          python conformance/harness/run.py --adapter "python conformance/validator/validator_adapter.py" --targets validator-structural,validator-profile,validator-full,validator-digest
      - name: fixtures regenerate byte for byte
        run: python conformance/generators/check_reproducible.py
      - name: reference adapter (full-scan oracle)
        run: python conformance/harness/run.py --adapter "python conformance/harness/reference_adapter.py"
      - name: Go adapter
        run: |
          (cd go && go build -o "$RUNNER_TEMP/seekparquet-conformance" ./internal/cmd/conformance)
          python conformance/harness/run.py --adapter "$RUNNER_TEMP/seekparquet-conformance"
          python conformance/generators/check_boolean.py --adapter "$RUNNER_TEMP/seekparquet-conformance"
          python conformance/generators/check_independent.py --adapter "$RUNNER_TEMP/seekparquet-conformance"
          python conformance/harness/check_indexed_access.py --language go
      - name: Go-written datasets (reference adapter, Python and Go validators, DuckDB)
        run: |
          python -m pip install duckdb==1.4.5
          (cd go && go run ./internal/cmd/samples "$RUNNER_TEMP/samples")
          python conformance/harness/check_datasets.py --adapter "python conformance/harness/reference_adapter.py" "$RUNNER_TEMP/samples"
          python conformance/harness/check_datasets.py --adapter "python conformance/validator/validator_adapter.py" "$RUNNER_TEMP/samples"
          python conformance/harness/check_datasets.py --adapter "$RUNNER_TEMP/seekparquet-conformance" "$RUNNER_TEMP/samples"
          python conformance/harness/check_datasets.py --target reader --adapter "$RUNNER_TEMP/seekparquet-conformance" "$RUNNER_TEMP/samples"
      - name: pyarrow recipe of docs/guides/producing.md validates in full
        run: |
          python docs/examples/pyarrow_writer.py "$RUNNER_TEMP/pyarrow-recipe"
          (cd go && go run ./cmd/seekparquet validate --level full "$RUNNER_TEMP/pyarrow-recipe")

  java:
    needs: changes
    # Go changes too: the Java reader reads the Go writer's datasets.
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            java/**/*.gradle.kts
            java/gradle/libs.versions.toml
            java/gradle/wrapper/gradle-wrapper.properties
      - uses: ./.github/actions/setup-go
        with:
          key: java
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: conformance/generators/requirements.txt
      - name: build and unit tests
        working-directory: java
        run: ./gradlew build :conformance:installDist
      - name: conformance (reader target)
        run: python conformance/harness/run.py --adapter java/conformance/build/install/seekparquet-conformance/bin/seekparquet-conformance
      - name: independent generated Boolean regression
        run: |
          python -m pip install -r conformance/generators/requirements.txt
          python conformance/generators/check_boolean.py --adapter java/conformance/build/install/seekparquet-conformance/bin/seekparquet-conformance
          python conformance/generators/check_independent.py --adapter java/conformance/build/install/seekparquet-conformance/bin/seekparquet-conformance
          python conformance/harness/check_indexed_access.py --language java
      - name: Go-written datasets (Java reader against their source rows)
        run: |
          (cd go && go run ./internal/cmd/samples "$RUNNER_TEMP/samples")
          python conformance/harness/check_datasets.py --target reader --adapter java/conformance/build/install/seekparquet-conformance/bin/seekparquet-conformance "$RUNNER_TEMP/samples"

  java-windows:
    needs: changes
    # Build and unit tests only (conformance runs in the java job): on Windows the default file system
    # has no secure directory streams, so LocalStorage takes its checked-path route there (issue #45).
    # Runs whenever the java job does, so that ci-ok gates both alike (scripts/ci/policy.py).
    if: needs.changes.outputs.java == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            java/**/*.gradle.kts
            java/gradle/libs.versions.toml
            java/gradle/wrapper/gradle-wrapper.properties
      - name: build and unit tests
        working-directory: java
        shell: bash
        run: ./gradlew build

  # Always runs: generated reference pages and snippets follow the code, and links follow every page.
  docs:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-go
        with:
          key: docs
      - name: generated reference pages, regions and snippets (docs/dev/docs.md)
        run: go -C go run ./internal/tools/docgen
      - name: links, requirement anchors and terminology
        run: |
          python3 -m unittest discover -s scripts/docs -p 'test_*.py'
          python3 scripts/docs/check_docs.py

  ci-ok:
    if: always()
    needs: [changes, go-lint, go-race, go-windows, go-macos, java, java-windows, conformance, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: every selected job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/policy.py --gate
