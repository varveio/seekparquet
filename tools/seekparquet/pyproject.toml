[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seekparquet-tools"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = ["pyarrow==26.0.1"]

[project.scripts]
seekparquet-write = "seekparquet.producer:main"
seekparquet-validate = "seekparquet.validate:main"

[tool.setuptools]
packages = ["seekparquet"]
package-dir = {seekparquet = "."}
